name: release

on:
  push:
    tags: [v*.*.*]

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: pkgxdev/setup@v5

      - run: pkgx just crossbuild

      - run: gh release create ${{ github.ref_name }} build/* --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
