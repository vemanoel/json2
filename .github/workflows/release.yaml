name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version"
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      MISE_DISABLE_TOOLS: go:golang.org/x/tools/gopls
    steps:
      - name: check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: set up mise
        uses: jdx/mise-action@v4.2.0
  
      - name: build artifacts
        run: mise run crossbuild

      - name: create release
        uses: softprops/action-gh-release@v3.0.2
        with:
          files: build/*
          generate_release_notes: true
          tag_name: v${{ inputs.version }}
  
