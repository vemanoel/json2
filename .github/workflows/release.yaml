name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version"
        type: string
        required: true

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: set up mise
        uses: jdx/mise-action@v4.2.0
        env:
          MISE_DISABLE_TOOLS: gh,go:golang.org/x/tools/gopls
  
      - name: build artifacts
        run: mise run crossbuild

      - name: create release
        run: gh release create v${{ inputs.version }} build/* --title v${{ inputs.version }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
