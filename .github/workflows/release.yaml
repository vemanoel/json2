name: release

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
  
      - name: Install devbox
        uses: jetify-com/devbox-install-action@v0.12.0
        with:
          project-path: '.'
          enable-cache: 'true'
          devbox-version: 0.17.5

      - run: devbox run -- just crossbuild
