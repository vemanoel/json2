name: release

on:
  push:
    tags: v*.*.*

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: check out repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: set up mise
        uses: jdx/mise-action@v4.2.0

      - name: build artifacts
        run: just crossbuild

      - name: create release
        run: gh release create ${{ github.ref_name }} build/* --title ${{ github.ref_name }} --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
