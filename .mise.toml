[tools]
gh = "2.97.0"
go = "1.26.0"
"go:golang.org/x/tools/gopls" = "0.23.0"

[tasks.default]
run = 'go run main.go'

[tasks.test]
run = 'go test -race -failfast -count 1 ./...'

[tasks.lint]
run = 'go vet ./...'

[tasks.build]
usage = '''
arg "<os>"
arg "<arch>"
'''

run = '''
#!/usr/bin/env bash
set -eu
out=build/${usage_os}_${usage_arch}
if [ $usage_os = "windows" ]; then
    out+=".exe"
fi
export GOOS=$usage_os
export GOARCH=$usage_arch
go build -ldflags "-s -w" -o $out
'''

[tasks.crossbuild]
depends = [
  "build linux amd64",
  "build linux 386",
  "build darwin amd64",
  "build darwin arm64",
  "build windows amd64",
  "build windows 386",
]

[tasks.gitconfig]
run = '''
#!/usr/bin/env bash
set -eu
read -p "github account email: " email
read -p "name: " name
read -rsp "github token: " token
echo
git config --local user.email $email
git config --local user.name $name
echo $token | gh auth login --with-token
helper="!mise exec -- gh auth git-credential"
git config --add credential.https://github.com.helper ''
git config --add credential.https://github.com.helper $helper
git config --add credential.https://gist.github.com.helper ''
git config --add credential.https://gist.github.com.helper $helper
'''
