[tools]
"aqua:nushell/nushell" = "0.115.0"
go = "1.26.0"
"go:golang.org/x/tools/gopls" = "0.23.0"

[task_config]
shell = "nu -c"

[tasks.default]
run = 'go run main.go'

[tasks.test]
run = 'go test -race -failfast -count 1 ./...'

[tasks.lint]
run = 'go vet ./...'

[tasks.build]
usage = '''
arg "<os>"
arg "<arch>"
'''

run = '''
$env.GOOS = $env.usage_os
$env.GOARCH = $env.usage_arch
mut out = $"build/($env.GOOS)_($env.GOARCH)"
if $env.GOOS == "windows" {
    $out += ".exe"
}
go build -ldflags "-s -w" -o $out
'''

[tasks.crossbuild]
depends = [
  "build linux amd64",
  "build linux 386",
  "build darwin amd64",
  "build darwin arm64",
  "build windows amd64",
  "build windows 386",
]
