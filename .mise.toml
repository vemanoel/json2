[tools]
gh = "2.97.0"
go = "1.26.0"
"go:golang.org/x/tools/gopls" = "0.23.0"

[tasks.default]
run = 'go run main.go'

[tasks.test]
run = 'go test -race -failfast -count 1 ./...'

[tasks.lint]
run = 'go vet ./...'

[tasks.build]
usage = '''
arg "<os>"
arg "<arch>"
'''

run = '''
#!/usr/bin/env bash
set -eu
out=build/${usage_os}_${usage_arch}
if [ $usage_os = "windows" ]; then
    out+=".exe"
fi
export GOOS=$usage_os
export GOARCH=$usage_arch
go build -ldflags "-s -w" -o $out
'''

run_windows = '''
#!powershell.exe
$ErrorActionPreference = "Stop"
$out = "build/${usage_os}_${usage_arch}"
if ($usage_os -eq "windows") {
    $out += ".exe"
}
$env:GOOS=$usage_os
$env:GOARCH=$usage_arch
go build -ldflags "-s -w" -o $out
'''

[tasks.crossbuild]
depends = [
  "build linux amd64",
  "build linux 386",
  "build darwin amd64",
  "build darwin arm64",
  "build windows amd64",
  "build windows 386",
]
